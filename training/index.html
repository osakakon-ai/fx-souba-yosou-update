<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="筋トレ" />
  <title>筋トレログ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">▰</div>
        <div>
          <div class="brand-title">筋トレログ</div>
          <div class="brand-sub">Workout Log</div>
        </div>
      </div>
      <button id="updateBtn" class="update-btn" type="button" aria-label="アプリを更新">↻ 更新</button>
    </header>

    <main class="main-content">
      <section id="calendarView" class="view active" aria-labelledby="calendarTab">
        <div class="section-head">
          <div>
            <h1>カレンダー</h1>
            <p>トレーニング実績を日ごとに記録</p>
          </div>
          <button id="todayBtn" class="ghost-btn" type="button">今月</button>
        </div>

        <div class="month-nav card">
          <button id="prevMonthBtn" class="icon-btn" type="button" aria-label="前の月">‹</button>
          <div id="monthTitle" class="month-title"></div>
          <button id="nextMonthBtn" class="icon-btn" type="button" aria-label="次の月">›</button>
        </div>

        <div class="calendar-card card">
          <div class="weekday-row">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <button id="installBtn" class="install-btn hidden" type="button">ホーム画面にアプリを追加</button>
      </section>

      <section id="menusView" class="view" aria-labelledby="menusTab">
        <div class="section-head">
          <div>
            <h1>筋トレメニュー</h1>
            <p>回数・重量・セット数・休憩を登録</p>
          </div>
        </div>

        <form id="menuForm" class="card form-card">
          <input id="menuId" type="hidden" />
          <label>
            種目名
            <input id="menuName" type="text" placeholder="例：ベンチプレス" maxlength="40" required />
          </label>
          <div class="form-grid">
            <label>重量（kg）<input id="menuWeight" type="number" min="0" step="0.5" value="20" required /></label>
            <label>回数<input id="menuReps" type="number" min="1" max="999" step="1" value="10" required /></label>
            <label>セット数<input id="menuSets" type="number" min="1" max="99" step="1" value="3" required /></label>
            <label>休憩（秒）<input id="menuInterval" type="number" min="0" max="3600" step="5" value="60" required /></label>
          </div>
          <div class="form-actions">
            <button id="menuCancelBtn" class="ghost-btn hidden" type="button">編集をやめる</button>
            <button class="primary-btn" type="submit">保存</button>
          </div>
        </form>

        <div id="menuList" class="stack"></div>
      </section>

      <section id="workoutView" class="view" aria-labelledby="workoutTab">
        <div class="section-head">
          <div>
            <h1>筋トレ</h1>
            <p>今日やるメニューを選んで開始</p>
          </div>
        </div>
        <div id="workoutContent"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button id="calendarTab" class="nav-btn active" data-view="calendarView" type="button"><span>▦</span><small>カレンダー</small></button>
      <button id="workoutTab" class="nav-btn" data-view="workoutView" type="button"><span>▶</span><small>筋トレ</small></button>
      <button id="menusTab" class="nav-btn" data-view="menusView" type="button"><span>☰</span><small>メニュー</small></button>
    </nav>
  </div>

  <dialog id="detailDialog" class="dialog">
    <div class="dialog-head">
      <h2 id="detailTitle">トレーニング記録</h2>
      <button id="detailCloseBtn" class="icon-btn" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="detailBody"></div>
  </dialog>

  <dialog id="shareDialog" class="dialog share-dialog">
    <div class="dialog-head">
      <h2>共有プレビュー</h2>
      <button id="shareCloseBtn" class="icon-btn" type="button" aria-label="閉じる">×</button>
    </div>
    <canvas id="shareCanvas" width="1080" height="1350"></canvas>
    <div class="dialog-actions">
      <button id="downloadShareBtn" class="ghost-btn" type="button">画像を保存</button>
      <button id="shareToXBtn" class="primary-btn" type="button">Xへ共有</button>
    </div>
    <p class="hint">Androidの共有画面が開いたらXを選択してください。</p>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
