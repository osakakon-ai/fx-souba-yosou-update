name: Build dinner camera confirmation 0314
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-dinner-camera-0314.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and validate
        run: |
          set -euo pipefail
          base64 -d dinner-build/v0314/source.b64 > /tmp/source.zip
          echo 'fb029cc1a45607160a0edb90b9083b459735801da71c4566da30c09b8fdc03da  /tmp/source.zip' | sha256sum -c -
          mkdir /tmp/dinner
          unzip -q /tmp/source.zip -d /tmp/dinner
          cd /tmp/dinner
          node --check app/src/main/assets/app.js
          gradle :app:assembleRelease --no-daemon
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t "$APK" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/camera-result"
          cp "$APK" "$GITHUB_WORKSPACE/camera-result/unsigned.apk"
          cd "$GITHUB_WORKSPACE"
          tar czf /tmp/camera0314.tar.gz -C camera-result .
          mkdir -p dinner-build/v0314/result
          base64 -w0 /tmp/camera0314.tar.gz | split -b 450000 -d -a 3 - dinner-build/v0314/result/part-
          sha256sum /tmp/camera0314.tar.gz > dinner-build/v0314/result/sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v0314/result
          git commit -m 'Stage unsigned dinner camera confirmation 0314'
          git push origin HEAD:main
      - name: Record build failure
        if: failure()
        run: |
          mkdir -p dinner-build/v0314
          echo "Build failed run ${GITHUB_RUN_ID}" > dinner-build/v0314/failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v0314/failure.txt
          git commit -m 'Record failed dinner camera confirmation build' && git push origin HEAD:main || true
