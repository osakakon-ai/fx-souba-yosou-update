name: Extract FX 2.275 APK for repair

on:
  push:
    paths:
      - 'repair-2.276/EXTRACT_READY'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export current APK as text chunks
        shell: bash
        run: |
          set -euo pipefail
          test -s FX-Souba-Yosou-2.275.apk
          mkdir -p repair-2.276/extracted
          base64 -w 0 FX-Souba-Yosou-2.275.apk > /tmp/fx2275.b64
          split -b 300000 -d -a 2 /tmp/fx2275.b64 repair-2.276/extracted/chunk_
          sha256sum FX-Souba-Yosou-2.275.apk > repair-2.276/extracted/sha256.txt
          wc -c FX-Souba-Yosou-2.275.apk > repair-2.276/extracted/size.txt
      - name: Commit extracted chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-2.276/extracted
          git commit -m "Stage FX 2.275 APK for 2.276 repair"
          git push
