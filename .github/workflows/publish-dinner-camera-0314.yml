name: Publish dinner camera 0314
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-dinner-camera-0314.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo '2cb494adb2908e0710d98ba45d9280faa41cc4c8a54c4e8ac5fbd89e05f8c102  dinner/Dinner-Photo-Log.apk' | sha256sum -c -
          cat dinner-build/v0314-release/part-* | base64 -d > /tmp/dinner.patch
          echo 'c7fc52f233f602a64abaaa0ba56e3d20d6ff9b9705c30479e4a5848e00d478b1  /tmp/dinner.patch' | sha256sum -c -
          zstd -d --patch-from=dinner/Dinner-Photo-Log.apk /tmp/dinner.patch -o /tmp/dinner-camera.apk
          echo 'bfc4ab5065918a33a3c09c1631b3b8e2746495e734ea71cb8eb42a202a44bb23  /tmp/dinner-camera.apk' | sha256sum -c -
          unzip -t /tmp/dinner-camera.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 /tmp/dinner-camera.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/dinner-camera.apk | grep -F "versionCode='27' versionName='0.3.14'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dinner/Dinner-Photo-Log.apk | grep -i 'Signer #1 certificate SHA-256 digest:' > /tmp/old-cert
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/dinner-camera.apk | grep -i 'Signer #1 certificate SHA-256 digest:' > /tmp/new-cert
          diff /tmp/old-cert /tmp/new-cert
          unzip -p /tmp/dinner-camera.apk assets/app.js > /tmp/app.js
          node --check /tmp/app.js
          unzip -p /tmp/dinner-camera.apk assets/index.html | grep -F 'id="openCameraBtn"'
          cp /tmp/dinner-camera.apk dinner/Dinner-Photo-Log-v0.3.14.apk
          cp /tmp/dinner-camera.apk dinner/Dinner-Photo-Log.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log-v0.3.14.apk dinner/Dinner-Photo-Log.apk
          git commit -m 'Publish dinner camera update v0.3.14'
          git push origin HEAD:main
      - name: Record publication failure
        if: failure()
        run: |
          echo "Run ${GITHUB_RUN_ID}" > dinner-build/v0314-release/failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v0314-release/failure.txt
          git commit -m 'Record dinner camera publication failure' && git push origin HEAD:main || true
