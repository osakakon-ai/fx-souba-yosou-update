name: Publish Dinner Photo Log v0.3.4
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v034/delta.json'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify the signed v0.3.4 APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, zipfile
          from pathlib import Path
          old=Path('dinner/Dinner-Photo-Log-v0.3.3.apk').read_bytes()
          patch=json.loads(Path('dinner-build/v034/delta.json').read_text())
          assert hashlib.sha256(old).hexdigest() == patch['old_sha256']
          updated=bytearray()
          for entry in patch['commands']:
              if entry[0]=='C':
                  offset,length=entry[1:]
                  assert 0<=offset<=len(old) and 0<=length<=len(old)-offset
                  updated.extend(old[offset:offset+length])
              elif entry[0]=='D':
                  updated.extend(base64.b64decode(entry[1],validate=True))
              else: raise ValueError('Unexpected APK patch command')
          assert hashlib.sha256(updated).hexdigest() == patch['new_sha256']
          target=Path('/tmp/Dinner-Photo-Log-v0.3.4.apk')
          target.write_bytes(updated)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert b'v0.3.4' in z.read('assets/index.html')
              assert b'scanExcludePeople' in z.read('assets/index.html')
              assert b'skinFaceHeuristic' in z.read('assets/app.js')
              assert '0.3.4'.encode('utf-16le') in z.read('AndroidManifest.xml')
          print('Verified signed update:',patch['new_sha256'])
          PY
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.4.apk dinner/Dinner-Photo-Log-v0.3.4.apk
          cp /tmp/Dinner-Photo-Log-v0.3.4.apk dinner/Dinner-Photo-Log.apk
          base64 -d dinner-build/v034/source.b64 > dinner-build/source.zip
          echo '32b768d4d7c1f24f02d67645b8b9ef0c3c8eb7d1bdbcf48be66b26b0212eae0f  dinner-build/source.zip' | sha256sum --check
      - name: Publish APK for existing in-app update button
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-v0.3.4.apk dinner-build/source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Dinner Photo Log v0.3.4: newest first and optional portrait filter'
          git push origin HEAD:main
