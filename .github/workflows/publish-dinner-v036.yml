name: Publish Dinner Photo Log v0.3.6 recovery
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v036/delta.json'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct signed recovery APK and apply safety gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, base64, hashlib, zipfile, pathlib, struct
          P=pathlib.Path
          old=P('dinner/Dinner-Photo-Log-v0.3.5.apk').read_bytes()
          patch=json.loads(P('dinner-build/v036/delta.json').read_text())
          assert hashlib.sha256(old).hexdigest()==patch['old_sha256']
          updated=bytearray()
          for c in patch['commands']:
              if c[0]=='C':
                  i,n=c[1:]
                  assert 0<=i<=len(old) and 0<=n<=len(old)-i
                  updated.extend(old[i:i+n])
              elif c[0]=='D':
                  updated.extend(base64.b64decode(c[1],validate=True))
              else:raise ValueError('bad patch opcode')
          updated=bytes(updated)
          assert hashlib.sha256(updated).hexdigest()==patch['new_sha256']
          assert patch['new_sha256']=='cf73a2fa9788c04caac0d8628e3fa209182bb68bca3d319035efc54afa0f2bbf'
          target=P('/tmp/Dinner-Photo-Log-v0.3.6.apk')
          target.write_bytes(updated)
          baseline=P('dinner/Dinner-Photo-Log-v0.3.4.apk')
          with zipfile.ZipFile(target) as z,zipfile.ZipFile(baseline) as b:
              assert z.testzip() is None
              assert z.read('classes.dex')==b.read('classes.dex'), 'DEX must match proven v0.3.4'
              assert hashlib.sha256(z.read('classes.dex')).hexdigest()=='1ec1eb0c7220dcf187633a675865df4f2246bf11bdd4a0b272db844b06387652'
              assert b'v0.3.6' in z.read('assets/index.html')
              assert b"const VERSION = '0.3.6';" in z.read('assets/app.js')
              manifest=z.read('AndroidManifest.xml')
              assert '0.3.6'.encode('utf-16le') in manifest
              assert 'jp.osakakon.dinnerphotolog'.encode('utf-16le') in manifest
              assert b'APK Sig Block 42' in updated
          print('Pass: signed APK SHA-256, zip CRC, manifest, baseline DEX.')
          PY
          unzip -p /tmp/Dinner-Photo-Log-v0.3.6.apk assets/app.js > /tmp/dinner-036.js
          node --check /tmp/dinner-036.js
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.6.apk dinner/Dinner-Photo-Log-v0.3.6.apk
          cp /tmp/Dinner-Photo-Log-v0.3.6.apk dinner/Dinner-Photo-Log.apk
          base64 -d dinner-build/v036/source.b64 > dinner-build/source.zip
          echo '5b3edf4c972cd9c50d560cb75b738a6917260301d9c83723f5900ef699011aeb  dinner-build/source.zip' | sha256sum --check
      - name: Update stable link for the app update button
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-v0.3.6.apk dinner-build/source.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Dinner Photo Log v0.3.6 recovery from stable build'
          git push origin HEAD:main
