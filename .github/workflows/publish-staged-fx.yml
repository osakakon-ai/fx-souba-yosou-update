name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.234/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.234/chunk_*.b64 > /tmp/fx234.b64
          base64 --decode /tmp/fx234.b64 > FX-Souba-Yosou-2.234.apk
          test "$(sha256sum FX-Souba-Yosou-2.234.apk | awk '{print $1}')" = "932a5aac4ac7a6b67ad3618c89007ebbdfff5e078b5c9c66e9cc339260aeac78"
          cp FX-Souba-Yosou-2.234.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200234,
            "versionName": "2.234",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.234.apk",
            "sha256": "932a5aac4ac7a6b67ad3618c89007ebbdfff5e078b5c9c66e9cc339260aeac78"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.234.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.234"
          git push
