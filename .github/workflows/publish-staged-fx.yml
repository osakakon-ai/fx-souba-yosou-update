name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.228/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.228/chunk_*.b64 > /tmp/fx228.b64
          base64 --decode /tmp/fx228.b64 > FX-Souba-Yosou-2.228.apk
          test "$(sha256sum FX-Souba-Yosou-2.228.apk | awk '{print $1}')" = "d3b2f8aa9f908fa9e8148f1b5b7be5c3ee90276bee621d9cbea6eea5c2e28ddc"
          cp FX-Souba-Yosou-2.228.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200228,
            "versionName": "2.228",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.228.apk",
            "sha256": "d3b2f8aa9f908fa9e8148f1b5b7be5c3ee90276bee621d9cbea6eea5c2e28ddc"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.228.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.228"
          git push
