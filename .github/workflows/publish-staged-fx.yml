name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.238/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.238/chunk_*.b64 > /tmp/fx238.b64
          base64 --decode /tmp/fx238.b64 > FX-Souba-Yosou-2.238.apk
          test "$(sha256sum FX-Souba-Yosou-2.238.apk | awk '{print $1}')" = "99b00312abd97cc20e30fd05816b2a418ddf8b25aa771edeac8ee5a12ef9e02f"
          cp FX-Souba-Yosou-2.238.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200238,
            "versionName": "2.238",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.238.apk",
            "sha256": "99b00312abd97cc20e30fd05816b2a418ddf8b25aa771edeac8ee5a12ef9e02f"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.238.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.238"
          git push
