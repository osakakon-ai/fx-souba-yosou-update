name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.244/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.244/chunk_*.b64 > /tmp/fx244.b64
          base64 --decode /tmp/fx244.b64 > FX-Souba-Yosou-2.244.apk
          test "$(sha256sum FX-Souba-Yosou-2.244.apk | awk '{print $1}')" = "e4ee11270d5eab3b6b66f9bb0006a43d27c24cfd5a52d422f320f93371ffe772"
          cp FX-Souba-Yosou-2.244.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200244,
            "versionName": "2.244",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.244.apk",
            "sha256": "e4ee11270d5eab3b6b66f9bb0006a43d27c24cfd5a52d422f320f93371ffe772"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.244.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.244"
          git push
