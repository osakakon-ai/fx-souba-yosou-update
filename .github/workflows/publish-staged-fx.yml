name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.230/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.230/chunk_*.b64 > /tmp/fx230.b64
          base64 --decode /tmp/fx230.b64 > FX-Souba-Yosou-2.230.apk
          test "$(sha256sum FX-Souba-Yosou-2.230.apk | awk '{print $1}')" = "a9c5d6fea12657d6cca90b2d6649f600216c08c17da0ea9b8296a96dd0384f0b"
          cp FX-Souba-Yosou-2.230.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200230,
            "versionName": "2.230",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.230.apk",
            "sha256": "a9c5d6fea12657d6cca90b2d6649f600216c08c17da0ea9b8296a96dd0384f0b"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.230.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.230"
          git push
