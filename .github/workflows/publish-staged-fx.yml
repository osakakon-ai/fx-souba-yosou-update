name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.248/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.248/chunk_*.b64 > /tmp/fx248.b64
          base64 --decode /tmp/fx248.b64 > FX-Souba-Yosou-2.248.apk
          test "$(sha256sum FX-Souba-Yosou-2.248.apk | awk '{print $1}')" = "0900ab9515ec5b3d224d09637f96a0ac6c02ea4db7153bfee5b83cab5a82427b"
          cp FX-Souba-Yosou-2.248.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200248,
            "versionName": "2.248",
            "apkUrl": "https://fx-souba-yosou-update.vercel.app/FX-Souba-Yosou.apk",
            "sha256": "0900ab9515ec5b3d224d09637f96a0ac6c02ea4db7153bfee5b83cab5a82427b"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.248.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.248"
          git push
