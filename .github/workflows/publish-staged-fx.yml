name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.221/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.221/chunk_*.b64 > /tmp/fx221.b64
          base64 --decode /tmp/fx221.b64 > FX-Souba-Yosou-2.221.apk
          test "$(sha256sum FX-Souba-Yosou-2.221.apk | awk '{print $1}')" = "eea7a01b5306f39d3c564a9835bbe389122349a76bba32eb5d216f6e5c5c14a7"
          cp FX-Souba-Yosou-2.221.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200221,
            "versionName": "2.221",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.221.apk",
            "sha256": "eea7a01b5306f39d3c564a9835bbe389122349a76bba32eb5d216f6e5c5c14a7"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.221.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.221"
          git push
