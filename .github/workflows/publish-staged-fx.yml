name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.229/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.229/chunk_*.b64 > /tmp/fx229.b64
          base64 --decode /tmp/fx229.b64 > FX-Souba-Yosou-2.229.apk
          test "$(sha256sum FX-Souba-Yosou-2.229.apk | awk '{print $1}')" = "66179066d55e084adc925911d1e6da84782c15208759fc5eee5fd9254a4bbb57"
          cp FX-Souba-Yosou-2.229.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200229,
            "versionName": "2.229",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.229.apk",
            "sha256": "66179066d55e084adc925911d1e6da84782c15208759fc5eee5fd9254a4bbb57"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.229.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.229"
          git push
