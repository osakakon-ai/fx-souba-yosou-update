name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.222/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.222/chunk_*.b64 > /tmp/fx222.b64
          base64 --decode /tmp/fx222.b64 > FX-Souba-Yosou-2.222.apk
          test "$(sha256sum FX-Souba-Yosou-2.222.apk | awk '{print $1}')" = "bbe4ad467fb8c47dacc30939eee6458934ee805f68c1d75bc51fbadc1aee4c6b"
          cp FX-Souba-Yosou-2.222.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200222,
            "versionName": "2.222",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.222.apk",
            "sha256": "bbe4ad467fb8c47dacc30939eee6458934ee805f68c1d75bc51fbadc1aee4c6b"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.222.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.222"
          git push
