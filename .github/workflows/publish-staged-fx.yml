name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.239/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.239/chunk_*.b64 > /tmp/fx239.b64
          base64 --decode /tmp/fx239.b64 > FX-Souba-Yosou-2.239.apk
          test "$(sha256sum FX-Souba-Yosou-2.239.apk | awk '{print $1}')" = "9492c816fb6ec15dd4a12c6b88eb05e15323a857ea7e56d85cbbb8d5dce3ef12"
          cp FX-Souba-Yosou-2.239.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200239,
            "versionName": "2.239",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.239.apk",
            "sha256": "9492c816fb6ec15dd4a12c6b88eb05e15323a857ea7e56d85cbbb8d5dce3ef12"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.239.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.239"
          git push
