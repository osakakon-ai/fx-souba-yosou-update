name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.240/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.240/chunk_*.b64 > /tmp/fx240.b64
          base64 --decode /tmp/fx240.b64 > FX-Souba-Yosou-2.240.apk
          test "$(sha256sum FX-Souba-Yosou-2.240.apk | awk '{print $1}')" = "83742c290b8e8a097b2fde39219f56fb01137266d092b175406d79dde771b5c3"
          cp FX-Souba-Yosou-2.240.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200240,
            "versionName": "2.240",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.240.apk",
            "sha256": "83742c290b8e8a097b2fde39219f56fb01137266d092b175406d79dde771b5c3"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.240.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.240"
          git push
