name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.247/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.247/chunk_*.b64 > /tmp/fx247.b64
          base64 --decode /tmp/fx247.b64 > FX-Souba-Yosou-2.247.apk
          test "$(sha256sum FX-Souba-Yosou-2.247.apk | awk '{print $1}')" = "7d4dacc4ef0c2d52f60ddacd4ae3a4bab96360bc9fda8b5411689ddf6c8baa76"
          cp FX-Souba-Yosou-2.247.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200247,
            "versionName": "2.247",
            "apkUrl": "https://fx-souba-yosou-update.vercel.app/FX-Souba-Yosou.apk",
            "sha256": "7d4dacc4ef0c2d52f60ddacd4ae3a4bab96360bc9fda8b5411689ddf6c8baa76"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.247.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.247"
          git push
