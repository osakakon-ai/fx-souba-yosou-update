name: Publish staged FX APK

on:
  push:
    paths:
      - 'publish-2.225/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat publish-2.225/chunk_*.b64 > /tmp/fx225.b64
          base64 --decode /tmp/fx225.b64 > FX-Souba-Yosou-2.225.apk
          test "$(sha256sum FX-Souba-Yosou-2.225.apk | awk '{print $1}')" = "ca814f9991ceb7a53ff84feda9bf459a6c733f4e3874aa1ddefcce735936685f"
          cp FX-Souba-Yosou-2.225.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200225,
            "versionName": "2.225",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.225.apk",
            "sha256": "ca814f9991ceb7a53ff84feda9bf459a6c733f4e3874aa1ddefcce735936685f"
          }
          JSON
      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FX-Souba-Yosou.apk FX-Souba-Yosou-2.225.apk latest.json
          git commit -m "Publish FX相場予想 Ver 2.225"
          git push
