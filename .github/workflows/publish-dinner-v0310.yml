name: Publish Dinner Photo Log v0.3.10 direct album picker
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v0310-release/patch.b64'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct signed APK and verify release invariants
        shell: bash
        run: |
          set -euo pipefail
          echo '58e0c7f1fd85c381f9da5f0135240cb2432b66e4aa3eb5a7ab1e885f34630b03  dinner/Dinner-Photo-Log-v0.3.9.apk' | sha256sum -c -
          tr -d '\r\n' < dinner-build/v0310-release/patch.b64 | base64 --decode >/tmp/dinner-v0310.zstpatch
          echo '3af45f7d8fd52902b3244f262cf62e79fd96556b30ab9113d63705dfcf1d4391  /tmp/dinner-v0310.zstpatch' | sha256sum -c -
          zstd -d --patch-from=dinner/Dinner-Photo-Log-v0.3.9.apk /tmp/dinner-v0310.zstpatch -o /tmp/Dinner-Photo-Log-v0.3.10.apk
          echo '50d148cc2234c8661fe7ff0b418a59cae87b7830ac6d252a42920b41100c11a0  /tmp/Dinner-Photo-Log-v0.3.10.apk' | sha256sum -c -
          unzip -t /tmp/Dinner-Photo-Log-v0.3.10.apk >/dev/null
          unzip -p /tmp/Dinner-Photo-Log-v0.3.10.apk assets/app.js >/tmp/dinner-app0310.js
          node --check /tmp/dinner-app0310.js
          unzip -p /tmp/Dinner-Photo-Log-v0.3.10.apk assets/index.html | grep -Fq 'id="queueDialog"'
          unzip -p /tmp/Dinner-Photo-Log-v0.3.10.apk assets/index.html | grep -Fq 'id="quickAddBtn"'
          if unzip -p /tmp/Dinner-Photo-Log-v0.3.10.apk assets/index.html | grep -Fq 'id="addView"'; then exit 1; fi
          base64 -d dinner-build/v0310/source.b64 >/tmp/dinner0310-source.zip
          echo '75cda82907893782855323de91ad89edfc80f91989e4cf0752c1d69fc2e748d1  /tmp/dinner0310-source.zip' | sha256sum -c -
          unzip -p /tmp/dinner0310-source.zip app/src/main/assets/app.js | cmp - /tmp/dinner-app0310.js
          unzip -p dinner-build/v0310/unsigned-android-release.apk classes.dex | sha256sum >/tmp/unsigned-dex.sha
          unzip -p /tmp/Dinner-Photo-Log-v0.3.10.apk classes.dex | sha256sum >/tmp/signed-dex.sha
          diff /tmp/unsigned-dex.sha /tmp/signed-dex.sha
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging /tmp/Dinner-Photo-Log-v0.3.10.apk | grep -F "versionCode='23' versionName='0.3.10'"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --print-certs dinner/Dinner-Photo-Log-v0.3.9.apk | grep -i 'Signer #1 certificate SHA-256 digest:' >/tmp/old-cert.txt
          "$SIGNER" verify --print-certs /tmp/Dinner-Photo-Log-v0.3.10.apk | grep -i 'Signer #1 certificate SHA-256 digest:' >/tmp/new-cert.txt
          diff /tmp/old-cert.txt /tmp/new-cert.txt
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.10.apk dinner/Dinner-Photo-Log-v0.3.10.apk
          cp /tmp/Dinner-Photo-Log-v0.3.10.apk dinner/Dinner-Photo-Log.apk
          cp /tmp/dinner0310-source.zip dinner-build/source.zip
      - name: Publish stable updater target for existing app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-v0.3.10.apk dinner-build/source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Dinner Photo Log v0.3.10: direct multi-photo picker'
          git push origin HEAD:main
      - name: Record a blocked update without replacing the stable APK
        if: failure()
        shell: bash
        run: |
          echo 'FAILED: v0.3.10 publish blocked by checksum/signature validation' > dinner-build/v0310-release/release-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v0310-release/release-failure.txt
          git commit -m 'Record Dinner Photo Log v0.3.10 blocked release' || exit 0
          git push origin HEAD:main
