                  return Math.max(-100,Math.min(100,base+learned));
          '''
          if old not in s: raise SystemExit('selected prediction score return anchor missing')
          s=s.replace(old,new,1)

          old='''        return (int)Math.max(-100,Math.min(100,Math.round(total/Math.max(.01,weight))));
              }
          '''
          new='''        int base=(int)Math.round(total/Math.max(.01,weight));
                  return Math.max(-100,Math.min(100,base+store.eventPredictionAdjustment("employment")));
              }
          '''
          if old not in s: raise SystemExit('employment prediction score return anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # ---- MonitoringService: resolve hidden results whenever full M5 history is refreshed ----
          p=java/'MonitoringService.java'
          s=p.read_text(encoding='utf-8')
          anchor='            ResearchLabEngine.step(this,raw);'
          if anchor not in s: raise SystemExit('MonitoringService learning anchor missing')
          s=s.replace(anchor,anchor+'\n\n            store.resolveEventForecasts(raw.get("M5"));',1)
          p.write_text(s,encoding='utf-8')

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/chappy_fx_android/chappy_fx_android/app
          ! grep -R "startForegroundService" "$APP/src/main/java/com/konchan/chappyfx"
          ! grep -q "FOREGROUND_SERVICE" "$APP/src/main/AndroidManifest.xml"
          ! grep -q "RECEIVE_BOOT_COMPLETED" "$APP/src/main/AndroidManifest.xml"
          ! grep -q "MonitoringBootReceiver" "$APP/src/main/AndroidManifest.xml"
          grep -q 'android:name=".FxApplication"' "$APP/src/main/AndroidManifest.xml"
          grep -q 'saveEventForecast' "$APP/src/main/java/com/konchan/chappyfx/DemoStore.java"
          grep -q 'resolveEventForecasts' "$APP/src/main/java/com/konchan/chappyfx/MonitoringService.java"
          grep -q 'eventPredictionAdjustment' "$APP/src/main/java/com/konchan/chappyfx/ImportantInfoActivity.java"
          grep -q '発表済みです。事前予想の表示は終了しました。' "$APP/src/main/java/com/konchan/chappyfx/ImportantInfoActivity.java"

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create ephemeral signing transfer key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-2.278/secure
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/fx2278-transfer-private.pem
          openssl pkey -in /tmp/fx2278-transfer-private.pem -pubout -out repair-2.278/secure/public.pem
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-2.278/secure/public.pem
          git commit -m "Publish ephemeral FX 2.278 transfer key"
          git push

      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            git fetch origin main >/dev/null 2>&1 || true
            if git cat-file -e origin/main:repair-2.278/secure/payload.enc.b64 2>/dev/null && git cat-file -e origin/main:repair-2.278/secure/secret.enc.b64 2>/dev/null; then
              git show origin/main:repair-2.278/secure/payload.enc.b64 > /tmp/payload.enc.b64
              git show origin/main:repair-2.278/secure/secret.enc.b64 > /tmp/secret.enc.b64
              break
            fi
            sleep 3
          done
          test -s /tmp/payload.enc.b64
          test -s /tmp/secret.enc.b64

      - name: Decrypt fixed signing key in runner memory
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/secret.enc.b64 > /tmp/secret.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/fx2278-transfer-private.pem \
            -in /tmp/secret.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/transfer-secret
          base64 --decode /tmp/payload.enc.b64 > /tmp/payload.enc
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass file:/tmp/transfer-secret \
            -in /tmp/payload.enc -out /tmp/signing-payload.tar.gz
          mkdir -p /tmp/fx-signing
          tar -xzf /tmp/signing-payload.tar.gz -C /tmp/fx-signing
          test -s /tmp/fx-signing/fx-demo-release.jks
          test -s /tmp/fx-signing/password.txt
          FX_SIGNING_PASSWORD="$(cat /tmp/fx-signing/password.txt)"
          echo "FX_SIGNING_STORE=/tmp/fx-signing/fx-demo-release.jks" >> "$GITHUB_ENV"
          echo "FX_SIGNING_PASSWORD=$FX_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          CERT_SHA256="$(keytool -list -v -keystore /tmp/fx-signing/fx-demo-release.jks -storepass "$FX_SIGNING_PASSWORD" -alias fxdemo | awk '/SHA256:/{print $2; exit}')"
          test "$CERT_SHA256" = "B7:E5:43:7C:2B:23:72:5F:14:F1:A0:16:4A:69:08:6B:E8:30:8B:BC:C7:20:85:4D:4D:E4:20:EA:0E:C2:52:27"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run engine self-test
        working-directory: /tmp/chappy_fx_android/chappy_fx_android
        shell: bash
        run: |
          rm -rf /tmp/chappy_fx_testclasses
          mkdir -p /tmp/chappy_fx_testclasses
          javac -d /tmp/chappy_fx_testclasses app/src/main/java/com/konchan/chappyfx/MarketEngine.java EngineSelfTest.java
          java -cp /tmp/chappy_fx_testclasses EngineSelfTest

      - name: Build signed 2.278
        working-directory: /tmp/chappy_fx_android/chappy_fx_android
        shell: bash
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/chappy_fx_android/chappy_fx_android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Eq 'Verified using v2 scheme.*true|Verified using v3 scheme.*true' /tmp/apksigner.txt
          grep -q 'Signer #1 certificate SHA-256 digest: b7e5437c2b23725f14f1a0164a69086be8308bbcc720854d4de420ea0ec25227' /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "versionCode='200278'" /tmp/badging.txt
          grep -q "versionName='2.278'" /tmp/badging.txt

      - name: Publish updater payload
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/chappy_fx_android/chappy_fx_android/app/build/outputs/apk/release/app-release.apk
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$APK" FX-Souba-Yosou-2.278.apk
          cp "$APK" FX-Souba-Yosou.apk
          cat > latest.json <<EOF
          {
            "versionCode": 200278,
            "versionName": "2.278",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.278.apk",
            "sha256": "$SHA"
          }
          EOF
          git rm -f --ignore-unmatch repair-2.278/secure/public.pem repair-2.278/secure/payload.enc.b64 repair-2.278/secure/secret.enc.b64
          git add FX-Souba-Yosou-2.278.apk FX-Souba-Yosou.apk latest.json
          git commit -m "Publish FX updater payload Ver 2.278"
          git push
