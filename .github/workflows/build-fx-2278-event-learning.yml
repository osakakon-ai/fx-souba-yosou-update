                  }catch(Exception ignored){}
              }
              public JSONArray eventForecastHistory(){try{return new JSONArray(market.getString("eventForecastHistory","[]"));}catch(Exception e){return new JSONArray();}}
              private String eventForecastId(String source,String title,long releaseMs){
                  return releaseMs+"|"+(source==null?"":source)+"|"+(title==null?"":title);
              }
              private String normalizeEventType(String raw){
                  String q=raw==null?"":raw.toLowerCase(Locale.US);
                  if(q.contains("雇用")||q.contains("employment")||q.contains("payroll")||q.contains("失業")||q.contains("jolts")||q.contains("labor"))return "employment";
                  if(q.contains("cpi")||q.contains("pce")||q.contains("物価")||q.contains("inflation")||q.contains("インフレ"))return "inflation";
                  if(q.contains("fomc")||q.contains("金融政策")||q.contains("政策金利")||q.contains("interest rate")||q.contains("treasury")||q.contains("金利"))return "rates";
                  if(q.contains("gdp")||q.contains("景気")||q.contains("growth")||q.contains("経済見通し"))return "growth";
                  if(q.contains("為替")||q.contains("foreign exchange")||q.contains("currency")||q.contains("介入"))return "fx";
                  return "other";
              }
              private double eventPriceNear(List<MarketEngine.Candle> rows,long target,long toleranceMs){
                  if(rows==null||rows.isEmpty())return Double.NaN;
                  long best=Long.MAX_VALUE;double price=Double.NaN;
                  for(MarketEngine.Candle c:rows){
                      long d=Math.abs(c.timeMs-target);
                      if(d<=toleranceMs&&d<best){best=d;price=c.c;}
                  }
                  return price;
              }
              private String directionFromMove(double move){
                  if(Double.isNaN(move)||Math.abs(move)<0.03)return "neutral";
                  return move>0?"up":"down";
              }
              private String eventReadMistake(String predicted,String actual,double move15,double move30){
                  if(predicted.equals(actual))return "";
                  if("neutral".equals(actual))return "方向感を強く見積もりすぎた";
                  if("neutral".equals(predicted))return "発表後の値動きの強さを過小評価した";
                  String p="up".equals(predicted)?"上昇":"下落",a="up".equals(actual)?"上昇":"下落";
                  return p+"予想に対して実際は"+a+"。材料の方向評価を見直す";
              }
              public void resolveEventForecasts(List<MarketEngine.Candle> m5){
                  if(m5==null||m5.isEmpty())return;
                  long now=System.currentTimeMillis();
                  JSONArray hist=eventForecastHistory();boolean changed=false;
                  try{
                      for(int i=0;i<hist.length();i++){
                          JSONObject x=hist.optJSONObject(i);if(x==null||x.has("resolvedAt"))continue;
                          long release=x.optLong("releaseMs",0);
                          if(release<=0||now<release+30L*60_000L)continue;
                          double p0=eventPriceNear(m5,release,7L*60_000L);
                          double p5=eventPriceNear(m5,release+5L*60_000L,7L*60_000L);
                          double p15=eventPriceNear(m5,release+15L*60_000L,7L*60_000L);
                          double p30=eventPriceNear(m5,release+30L*60_000L,7L*60_000L);
                          if(Double.isNaN(p0)||Double.isNaN(p15)||Double.isNaN(p30))continue;
                          double d5=Double.isNaN(p5)?Double.NaN:p5-p0,d15=p15-p0,d30=p30-p0;
                          double judged=Math.abs(d15)>=0.03?d15:d30;
                          String actual=directionFromMove(judged),pred=x.optString("predictedDir","neutral");
                          boolean hit=pred.equals(actual);
                          x.put("actualDir",actual).put("hit",hit).put("resolvedAt",now).put("basePrice",p0)
                           .put("move15",d15).put("move30",d30).put("readMistake",eventReadMistake(pred,actual,d15,d30));
                          if(!Double.isNaN(d5))x.put("move5",d5);
                          changed=true;
                      }
                      if(changed)market.edit().putString("eventForecastHistory",hist.toString()).apply();
                  }catch(Exception ignored){}
              }
              public int eventPredictionAdjustment(String context){
                  String type=normalizeEventType(context);JSONArray a=eventForecastHistory();
                  double sum=0,weight=0;int n=0;
                  for(int i=0;i<a.length()&&n<12;i++){
                      JSONObject x=a.optJSONObject(i);if(x==null||!x.has("resolvedAt")||!type.equals(x.optString("type","")))continue;
                      String actual=x.optString("actualDir","neutral");
                      int target="up".equals(actual)?55:"down".equals(actual)?-55:0;
                      int pred=x.optInt("score",0);
                      double w=Math.max(.45,1.0-n*.06);
                      sum+=(target-pred)*w;weight+=w;n++;
                  }
                  if(n<3||weight<=0)return 0;
                  int adj=(int)Math.round((sum/weight)*0.30);
                  return Math.max(-15,Math.min(15,adj));
              }
