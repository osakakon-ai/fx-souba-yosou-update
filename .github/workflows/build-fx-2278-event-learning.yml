          anchor='    public double employmentCalibrationK(){JSONArray a=employmentHistory();double sum=0;int n=0;for(int i=0;i<a.length()&&n<6;i++){JSONObject x=a.optJSONObject(i);if(x!=null&&x.has("actualK")){sum+=x.optDouble("errorK",0);n++;}}if(n<3)return 0;return Math.max(-25,Math.min(25,sum/n));}\n'
          if anchor not in s: raise SystemExit('DemoStore employment calibration anchor missing')
          addition=r'''
              public void saveEventForecast(String source,String title,String context,long releaseMs,int score,int confidence){
                  long now=System.currentTimeMillis();
                  if(releaseMs<=now)return;
                  try{
                      String type=normalizeEventType((context==null?"":context)+" "+(title==null?"":title));
                      String id=eventForecastId(source,title,releaseMs);
                      JSONObject rec=new JSONObject();
                      rec.put("id",id).put("source",source==null?"":source).put("title",title==null?"":title).put("type",type)
                         .put("releaseMs",releaseMs).put("score",Math.max(-100,Math.min(100,score))).put("confidence",Math.max(0,Math.min(100,confidence)))
                         .put("predictedDir",score>=15?"up":score<=-15?"down":"neutral").put("savedAt",now);
                      double mid=lastMid();if(!Double.isNaN(mid))rec.put("preMid",mid);
                      JSONArray old=eventForecastHistory(),out=new JSONArray();out.put(rec);
                      for(int i=0;i<old.length()&&out.length()<80;i++){
                          JSONObject x=old.optJSONObject(i);if(x==null||id.equals(x.optString("id","")))continue;out.put(x);
                      }
