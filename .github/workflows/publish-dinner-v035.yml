name: Publish Dinner Photo Log v0.3.5
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v035/delta.json'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and check signed v0.3.5 APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, zipfile
          from pathlib import Path
          old=Path('dinner/Dinner-Photo-Log-v0.3.4.apk').read_bytes()
          patch=json.loads(Path('dinner-build/v035/delta.json').read_text())
          assert hashlib.sha256(old).hexdigest() == patch['old_sha256']
          updated=bytearray()
          for entry in patch['commands']:
              if entry[0]=='C':
                  offset,length=entry[1:]
                  assert isinstance(offset,int) and isinstance(length,int)
                  assert 0<=offset<=len(old) and 0<=length<=len(old)-offset
                  updated.extend(old[offset:offset+length])
              elif entry[0]=='D':
                  updated.extend(base64.b64decode(entry[1],validate=True))
              else:
                  raise ValueError('Unknown patch command')
          assert hashlib.sha256(updated).hexdigest() == patch['new_sha256']
          assert patch['new_sha256']=='add57c069b55969ad7ce35c77065c0288a27399c061f3ca070633ed52ff8b3f8'
          target=Path('/tmp/Dinner-Photo-Log-v0.3.5.apk')
          target.write_bytes(updated)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              html=z.read('assets/index.html')
              js=z.read('assets/app.js')
              dex=z.read('classes.dex')
              assert b'v0.3.5' in html
              assert b'Google' in html or 'google' in html.lower() or 'photoInput' in html
              assert b'bodyShapeHeuristic' in js
              assert b'restoreHiddenBtn' in js
              assert b'android.intent.action.GET_CONTENT' in dex
              assert '0.3.5'.encode('utf-16le') in z.read('AndroidManifest.xml')
          print('APK SHA256 verified:',patch['new_sha256'])
          PY
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.5.apk dinner/Dinner-Photo-Log-v0.3.5.apk
          cp /tmp/Dinner-Photo-Log-v0.3.5.apk dinner/Dinner-Photo-Log.apk
          base64 -d dinner-build/v035/source.b64 > dinner-build/source.zip
          echo '2d25662d2b9399146c9824cb2695291e274f57120e3ccd4d599a86a6c009f936  dinner-build/source.zip' | sha256sum --check
      - name: Publish APK for existing in-app update button
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-v0.3.5.apk dinner-build/source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Dinner Photo Log v0.3.5: people filters and Google Photos picker'
          git push origin HEAD:main
