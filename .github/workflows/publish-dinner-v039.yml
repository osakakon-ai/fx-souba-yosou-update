name: Publish Dinner Photo Log v0.3.9 single-photo repair
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v039-release/part-*.b64'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble signed APK; validate photo saving fix and stable installation
        shell: bash
        run: |
          set -euo pipefail
          cat dinner-build/v039-release/part-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/dinner-v039.zstdpatch
          echo '55e8fbc24c130aac39237b9762bb2f8aa76610c86d2b9de4e3692e756667d02e  /tmp/dinner-v039.zstdpatch' | sha256sum -c -
          zstd -d --patch-from=dinner/Dinner-Photo-Log-v0.3.8.apk /tmp/dinner-v039.zstdpatch -o /tmp/Dinner-Photo-Log-v0.3.9.apk
          echo '58e0c7f1fd85c381f9da5f0135240cb2432b66e4aa3eb5a7ab1e885f34630b03  /tmp/Dinner-Photo-Log-v0.3.9.apk' | sha256sum -c -
          unzip -t /tmp/Dinner-Photo-Log-v0.3.9.apk >/dev/null
          unzip -p /tmp/Dinner-Photo-Log-v0.3.9.apk assets/app.js >/tmp/dinner-app039.js
          node --check /tmp/dinner-app039.js
          grep -Fq 'window.dinnerSinglePhotoResult' /tmp/dinner-app039.js
          grep -Fq "const countNode=" /tmp/dinner-app039.js
          grep -Fq "btn.innerHTML=" /tmp/dinner-app039.js
          base64 -d dinner-build/v039/source.b64 > /tmp/dinner039-source.zip
          echo '26e5ab9bbddebb454f938b00b0173322679ae0122b0ba5c3eeaa934d53d9be8a  /tmp/dinner039-source.zip' | sha256sum -c -
          unzip -p /tmp/dinner039-source.zip app/src/main/assets/app.js | cmp - /tmp/dinner-app039.js
          unzip -p dinner-build/v039/unsigned-android-release.apk classes.dex | sha256sum >/tmp/built-dex.sha
          unzip -p /tmp/Dinner-Photo-Log-v0.3.9.apk classes.dex | sha256sum >/tmp/published-dex.sha
          diff /tmp/built-dex.sha /tmp/published-dex.sha
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging /tmp/Dinner-Photo-Log-v0.3.9.apk | grep -F "versionCode='22' versionName='0.3.9'"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --print-certs dinner/Dinner-Photo-Log-v0.3.8.apk | grep -i 'Signer #1 certificate SHA-256 digest:' >/tmp/before.sha
          "$SIGNER" verify --print-certs /tmp/Dinner-Photo-Log-v0.3.9.apk | grep -i 'Signer #1 certificate SHA-256 digest:' >/tmp/after.sha
          diff /tmp/before.sha /tmp/after.sha
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.9.apk dinner/Dinner-Photo-Log-v0.3.9.apk
          cp /tmp/Dinner-Photo-Log-v0.3.9.apk dinner/Dinner-Photo-Log.apk
          cp /tmp/dinner039-source.zip dinner-build/source.zip
      - name: Publish fixed URL for in-app Update button
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log-v0.3.9.apk dinner/Dinner-Photo-Log.apk dinner-build/source.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Dinner Photo Log v0.3.9: fix native one-photo save'
          git push origin HEAD:main
      - name: Record failed verification (do not replace stable APK)
        if: failure()
        shell: bash
        run: |
          echo 'FAILED: v0.3.9 release was blocked by APK or signature verification.' > dinner-build/v039-release/release-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v039-release/release-failure.txt
          git commit -m 'Record v0.3.9 publish validation failure' || exit 0
          git push origin HEAD:main
