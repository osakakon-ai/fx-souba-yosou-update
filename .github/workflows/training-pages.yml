name: Deploy Training App to Pages
on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/training-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "training-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload training app
        uses: actions/upload-pages-artifact@v4
        with:
          path: training
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
