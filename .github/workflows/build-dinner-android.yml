name: Build Dinner Photo Log (standard Android)
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/source.zip'
      - '.github/workflows/build-dinner-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        shell: bash
        run: |
          mkdir -p dinner-build/project
          unzip -q dinner-build/source.zip -d dinner-build/project
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile unsigned release APK
        working-directory: dinner-build/project
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK archive
        run: unzip -t dinner-build/project/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Save unsigned APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: dinner-photo-log-v0.2.6-unsigned
          path: dinner-build/project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
