name: Publish dinner camera 0313
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-dinner-camera-0313.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo 'f3b48ec4f4c6de3719399b700675d685d879c1c9685545507c50807821d9740c  dinner/Dinner-Photo-Log.apk' | sha256sum -c -
          cat dinner-build/v0313-release/part-* | base64 -d > /tmp/dinner.patch
          echo '96760bc0204bc30e6d65490fa901fce97bb1e25a78da46be552920365d7eae07  /tmp/dinner.patch' | sha256sum -c -
          zstd -d --patch-from=dinner/Dinner-Photo-Log.apk /tmp/dinner.patch -o /tmp/dinner-camera.apk
          echo '2cb494adb2908e0710d98ba45d9280faa41cc4c8a54c4e8ac5fbd89e05f8c102  /tmp/dinner-camera.apk' | sha256sum -c -
          unzip -t /tmp/dinner-camera.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 /tmp/dinner-camera.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/dinner-camera.apk | grep -F "versionCode='26' versionName='0.3.13'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dinner/Dinner-Photo-Log.apk | grep -i 'Signer #1 certificate SHA-256 digest:' > /tmp/old-cert
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/dinner-camera.apk | grep -i 'Signer #1 certificate SHA-256 digest:' > /tmp/new-cert
          diff /tmp/old-cert /tmp/new-cert
          unzip -p /tmp/dinner-camera.apk assets/app.js > /tmp/app.js
          node --check /tmp/app.js
          unzip -p /tmp/dinner-camera.apk assets/index.html | grep -F 'id="openCameraBtn"'
          cp /tmp/dinner-camera.apk dinner/Dinner-Photo-Log-v0.3.13.apk
          cp /tmp/dinner-camera.apk dinner/Dinner-Photo-Log.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log-v0.3.13.apk dinner/Dinner-Photo-Log.apk
          git commit -m 'Publish dinner camera update v0.3.13'
          git push origin HEAD:main
      - name: Record publication failure
        if: failure()
        run: |
          echo "Run ${GITHUB_RUN_ID}" > dinner-build/v0313-release/failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v0313-release/failure.txt
          git commit -m 'Record dinner camera publication failure' && git push origin HEAD:main || true
