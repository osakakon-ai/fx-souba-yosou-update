name: Publish Dinner Photo Log signed APK
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/release/part-*.b64'
      - '.github/workflows/publish-dinner-signed.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assemble corrected aligned APK
        shell: bash
        run: |
          set -euo pipefail
          cat $(find dinner-build/release -maxdepth 1 -name 'part-*.b64' | sort) | tr -d '\r\n\t ' | base64 -d > dinner/Dinner-Photo-Log.apk
          echo '6cf85f3fde91abc28da56707b3ecbe34c58c021304484a447f0b6433fdea8042  dinner/Dinner-Photo-Log.apk' | sha256sum -c -
          unzip -t dinner/Dinner-Photo-Log.apk >/dev/null
          SDK="/usr/local/lib/android/sdk/build-tools/35.0.0"
          "$SDK/zipalign" -c -v 4 dinner/Dinner-Photo-Log.apk | tail -3
          "$SDK/apksigner" verify --verbose --print-certs dinner/Dinner-Photo-Log.apk
      - name: Publish corrected APK with fixed update URL
        shell: bash
        run: |
          set -euo pipefail
          cp dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-fixed.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-fixed.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish correctly aligned Dinner Photo Log installer'
          git push
