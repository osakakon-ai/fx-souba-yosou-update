name: Publish Dinner Photo Log v0.3.8 album ZIP import
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v038/part-*.b64'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed APK built with official Gradle
        shell: bash
        run: |
          set -euo pipefail
          cat dinner-build/v038/part-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/dinner038.zstpatch
          echo 'fb4f35a0df305d83e504e5a7a4fb3104d369f6088aafaec6f4bc5d1038ffc700  /tmp/dinner038.zstpatch' | sha256sum -c -
          zstd -d --patch-from=dinner/Dinner-Photo-Log-v0.3.7.apk /tmp/dinner038.zstpatch -o /tmp/Dinner-Photo-Log-v0.3.8.apk
          echo 'fb7d0cb492a25825032277dbe74cb5047bf39a57d27b0ff3b577afdc455760d1  /tmp/Dinner-Photo-Log-v0.3.8.apk' | sha256sum -c -
          unzip -t /tmp/Dinner-Photo-Log-v0.3.8.apk >/dev/null
          unzip -p /tmp/Dinner-Photo-Log-v0.3.8.apk assets/app.js >/tmp/dinner-app038.js
          node --check /tmp/dinner-app038.js
          grep -F 'window.dinnerZipItem' /tmp/dinner-app038.js
          unzip -p /tmp/Dinner-Photo-Log-v0.3.8.apk classes.dex | sha256sum | grep -F '78b2e39ad8abef30e126e11265269ccbfae9acf44936e776a5afe9b7f3ff6a2c'
          unzip -p dinner-build/v038/unsigned-android-release.apk classes.dex | sha256sum > /tmp/unsigned-dex.sha
          unzip -p /tmp/Dinner-Photo-Log-v0.3.8.apk classes.dex | sha256sum >/tmp/signed-dex.sha
          diff /tmp/unsigned-dex.sha /tmp/signed-dex.sha
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging /tmp/Dinner-Photo-Log-v0.3.8.apk | grep -F "versionCode='21' versionName='0.3.8'"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --print-certs dinner/Dinner-Photo-Log-v0.3.7.apk | grep -i 'Signer #1 certificate SHA-256 digest:' >/tmp/old-cert.txt
          "$SIGNER" verify --print-certs /tmp/Dinner-Photo-Log-v0.3.8.apk | grep -i 'Signer #1 certificate SHA-256 digest:' >/tmp/new-cert.txt
          diff /tmp/old-cert.txt /tmp/new-cert.txt
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.8.apk dinner/Dinner-Photo-Log-v0.3.8.apk
          cp /tmp/Dinner-Photo-Log-v0.3.8.apk dinner/Dinner-Photo-Log.apk
          base64 -d dinner-build/v038/source.b64 > dinner-build/source.zip
          echo 'fd44147e98b88d9805e00104d446b42cb46357047bc19cf01ad15f37e31290bd  dinner-build/source.zip' | sha256sum -c -
      - name: Publish latest signed APK for in-app Update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log-v0.3.8.apk dinner/Dinner-Photo-Log.apk dinner-build/source.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Dinner Photo Log v0.3.8: album ZIP bulk importer'
          git push origin HEAD:main
      - name: Record publication failure
        if: failure()
        shell: bash
        run: |
          echo 'FAILED: v0.3.8 release blocked by verification. Previous stable remains.' > dinner-build/v038/release-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dinner-build/v038/release-failure.txt
          git commit -m 'Record v0.3.8 publication failure' || exit 0
          git push origin HEAD:main
