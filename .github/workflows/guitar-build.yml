name: Guitar Android Build

on:
  push:
    branches:
      - guitar-build-20261002
    paths:
      - "guitar-build/**"
      - ".github/workflows/guitar-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        shell: bash
        run: |
          test -f guitar-build/android/app/build.gradle
          test -f guitar-build/android/app/src/main/assets/index.html
          test -f guitar-build/android/app/src/main/java/jp/osakakon/guitarchordsheet/MainActivity.java

      - name: Build unsigned release APK
        working-directory: guitar-build/android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare signing-tool bundle
        shell: bash
        run: |
          mkdir -p out
          cp guitar-build/android/app/build/outputs/apk/release/app-release-unsigned.apk out/Guitar-Chord-Sheet-unsigned.apk
          mkdir -p out/build-tools
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." out/build-tools/
          test -f out/build-tools/apksigner
          test -f out/build-tools/zipalign

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: guitar-unsigned-build
          path: out/
          if-no-files-found: error
          retention-days: 1
