name: Guitar Android Build

on:
  push:
    branches:
      - guitar-build-20261002
    paths:
      - "guitar-build/**"
      - ".github/workflows/guitar-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore Android project
        shell: bash
        run: |
          base64 -d guitar-build/guitar-android.tar.gz.b64 > /tmp/guitar-android.tar.gz
          tar -xzf /tmp/guitar-android.tar.gz
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/index.html

      - name: Build unsigned release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare signing-tool bundle
        shell: bash
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/Guitar-Chord-Sheet-unsigned.apk
          mkdir -p out/build-tools
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." out/build-tools/
          test -f out/build-tools/apksigner
          test -f out/build-tools/zipalign

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: guitar-unsigned-build
          path: out/
          if-no-files-found: error
          retention-days: 1
