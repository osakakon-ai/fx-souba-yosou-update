name: Guitar Android Build

on:
  push:
    branches:
      - guitar-build-20261002
    paths:
      - "guitar-build/**"
      - ".github/workflows/guitar-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        shell: bash
        run: |
          test -f guitar-build/android/app/build.gradle
          test -f guitar-build/android/app/src/main/assets/index.html
          test -f guitar-build/android/app/src/main/java/jp/osakakon/guitarchordsheet/MainActivity.java

      - name: Validate app JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("guitar-build/android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = src.find("<script>")
          end = src.find("</script>", start + 8)
          if start < 0 or end < 0:
              raise SystemExit("script block not found")
          Path("/tmp/guitar-app.js").write_text(src[start + 8:end], encoding="utf-8")
          PY
          node --check /tmp/guitar-app.js

      - name: Build unsigned release APK
        working-directory: guitar-build/android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare unsigned APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p out/android-build-tools/lib
          cp guitar-build/android/app/build/outputs/apk/release/app-release-unsigned.apk out/Guitar-Chord-Sheet-unsigned.apk
          cp "$TOOLS/apksigner" out/android-build-tools/apksigner
          cp "$TOOLS/zipalign" out/android-build-tools/zipalign
          cp "$TOOLS/lib/apksigner.jar" out/android-build-tools/lib/apksigner.jar
          if [ -d "$TOOLS/lib64" ]; then
            cp -a "$TOOLS/lib64" out/android-build-tools/
          fi
          chmod +x out/android-build-tools/apksigner out/android-build-tools/zipalign

      - name: Upload unsigned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: guitar-unsigned-build
          path: out/
          if-no-files-found: error
          retention-days: 1
