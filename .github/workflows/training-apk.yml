name: Build Training APK
on:
  push:
    branches: [main]
    paths:
      - "training-native/**"
      - ".github/workflows/training-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        run: gradle -p training-native --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Training-App
          path: training-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        run: |
          mkdir -p training
          cp training-native/app/build/outputs/apk/debug/app-debug.apk training/Training-App.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/Training-App.apk
          git commit -m "Publish training app APK" || exit 0
          git push
