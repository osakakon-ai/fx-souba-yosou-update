name: Build Training APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "training-build/source.zip"
      - ".github/workflows/training-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract
        run: |
          rm -rf training-android
          mkdir training-android
          unzip -q training-build/source.zip -d training-android
          if [ -d training-android/training_app_android ]; then
            shopt -s dotglob
            mv training-android/training_app_android/* training-android/
            rmdir training-android/training_app_android
          fi
      - name: Build installable APK
        run: gradle -p training-android --no-daemon assembleDebug
      - name: Publish APK
        run: |
          mkdir -p training
          cp training-android/app/build/outputs/apk/debug/app-debug.apk training/Training-App.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/Training-App.apk
          git commit -m "Publish training app APK" || exit 0
          git push
