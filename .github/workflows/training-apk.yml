name: Build Training APK
on:
  push:
    branches: [main]
    paths:
      - "training-native/**"
      - ".github/workflows/training-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned release APK
        run: gradle -p training-native --no-daemon assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Training-App-Unsigned
          path: training-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Collect Android APK signing tool
        run: |
          set -e
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p apksigner-tool/lib
          cp "$BUILD_TOOLS/apksigner" apksigner-tool/
          cp "$BUILD_TOOLS/lib/apksigner.jar" apksigner-tool/lib/
          if [ -f "$BUILD_TOOLS/zipalign" ]; then cp "$BUILD_TOOLS/zipalign" apksigner-tool/; fi

      - name: Upload APK signing tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Signing-Tool
          path: apksigner-tool
          if-no-files-found: error
