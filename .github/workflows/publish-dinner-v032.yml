name: Publish Dinner Photo Log v0.3.2
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v032/part-*.b64'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble signed update and source
        shell: bash
        run: |
          set -euo pipefail
          cat dinner-build/v032/part-*.b64 | tr -d '\r\n' | base64 --decode | gzip -d > /tmp/Dinner-Photo-Log-v0.3.2.apk
          echo "2776b55c29b6b0931d7c3952997fc4ddae2ea1143f151914ce10f2946d8f8e32  /tmp/Dinner-Photo-Log-v0.3.2.apk" | sha256sum --check
          unzip -t /tmp/Dinner-Photo-Log-v0.3.2.apk >/dev/null
          unzip -p /tmp/Dinner-Photo-Log-v0.3.2.apk assets/index.html | grep -F 'v0.3.2'
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.2.apk dinner/Dinner-Photo-Log-v0.3.2.apk
          cp /tmp/Dinner-Photo-Log-v0.3.2.apk dinner/Dinner-Photo-Log.apk
          base64 -d dinner-build/v032/source.b64 > dinner-build/source.zip
          echo "e3b5fb8bf0d8b01643e5c3b7352a6cd4c4a0e0e4e9087585bc5d11a247ff264f  dinner-build/source.zip" | sha256sum --check
      - name: Publish updater file and source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-v0.3.2.apk dinner-build/source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Dinner Photo Log v0.3.2: improved meal discovery'
          git push origin HEAD:main
