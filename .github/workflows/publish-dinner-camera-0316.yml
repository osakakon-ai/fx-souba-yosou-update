name: Publish dinner camera 0316
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-dinner-camera-0316.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo 'e1a4ea812ae09a1e310607bddb11c4f6d1045715abf069dfd2c713345948ad42  dinner/Dinner-Photo-Log.apk' | sha256sum -c -
          cat dinner-build/v0316-release/part-* | base64 -d > /tmp/dinner.patch
          echo '56fbb5b4507d82385b3ab7e752ba2b3152d666ed899558301a79f6422e9cf9ed  /tmp/dinner.patch' | sha256sum -c -
          zstd -d --patch-from=dinner/Dinner-Photo-Log.apk /tmp/dinner.patch -o /tmp/dinner-camera.apk
          echo '83fb0d5e7b70dbdca6965bcb1d102a7b42b555dedeece67a922c8bc9f0ee3b37  /tmp/dinner-camera.apk' | sha256sum -c -
          unzip -t /tmp/dinner-camera.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 /tmp/dinner-camera.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/dinner-camera.apk | grep -F "versionCode='29' versionName='0.3.16'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dinner/Dinner-Photo-Log.apk | grep -i 'Signer #1 certificate SHA-256 digest:' > /tmp/old-cert
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/dinner-camera.apk | grep -i 'Signer #1 certificate SHA-256 digest:' > /tmp/new-cert
          diff /tmp/old-cert /tmp/new-cert
          unzip -p /tmp/dinner-camera.apk assets/app.js > /tmp/app.js
          node --check /tmp/app.js
          unzip -p /tmp/dinner-camera.apk assets/index.html | grep -F 'id="openCameraBtn"'
          cp /tmp/dinner-camera.apk dinner/Dinner-Photo-Log-v0.3.16.apk
          cp /tmp/dinner-camera.apk dinner/Dinner-Photo-Log.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log-v0.3.16.apk dinner/Dinner-Photo-Log.apk
          git commit -m 'Publish dinner camera update v0.3.16'
          git push origin HEAD:main
      - name: Record publication failure
        if: failure()
        run: |
          echo "Run ${GITHUB_RUN_ID}" > dinner-build/v0316-release/failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v0316-release/failure.txt
          git commit -m 'Record dinner camera publication failure' && git push origin HEAD:main || true
