name: Publish Dinner Photo Log v0.3.1
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v031/part-*.b64'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify signed update APK
        shell: bash
        run: |
          set -euo pipefail
          cat dinner-build/v031/part-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/Dinner-Photo-Log-v0.3.1.apk
          echo "3101e898634119e4200304f1ae3812c0c726ef552d0df134c4f6f8dca3a17ace  /tmp/Dinner-Photo-Log-v0.3.1.apk" | sha256sum --check
          unzip -t /tmp/Dinner-Photo-Log-v0.3.1.apk > /dev/null
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.1.apk dinner/Dinner-Photo-Log-v0.3.1.apk
          cp /tmp/Dinner-Photo-Log-v0.3.1.apk dinner/Dinner-Photo-Log.apk
      - name: Publish stable updater target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log.apk dinner/Dinner-Photo-Log-v0.3.1.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Dinner Photo Log v0.3.1 update APK'
          git push origin HEAD:main
