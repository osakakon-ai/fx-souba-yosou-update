name: Publish FX 2.303 H8 repair

on:
  push:
    paths:
      - 'repair-2.303/PUBLISH_READY'

permissions:
  contents: write

concurrency:
  group: fx-2303-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"

      - name: Reconstruct and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          cat repair-2.303/signed/apk.part*.b64 > /tmp/FX-Souba-Yosou-2.303.apk.b64
          base64 --decode /tmp/FX-Souba-Yosou-2.303.apk.b64 > /tmp/FX-Souba-Yosou-2.303.apk
          test "$(sha256sum /tmp/FX-Souba-Yosou-2.303.apk | awk '{print $1}')" = "67967bd9db9fcce9f48ff95a417dcc5c04bf5421d51c403dbbb6d13fd16c2b5b"

          export ANDROID_HOME=/usr/local/lib/android/sdk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/FX-Souba-Yosou-2.303.apk | tee /tmp/apksigner.txt
          grep -qi "Signer #1 certificate SHA-256 digest: b7e5437c2b23725f14f1a0164a69086be8308bbcc720854d4de420ea0ec25227" /tmp/apksigner.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/FX-Souba-Yosou-2.303.apk | head -1 | tee /tmp/badging.txt
          grep -q "name='com.konchan.chappyfx'" /tmp/badging.txt
          grep -q "versionCode='200303'" /tmp/badging.txt
          grep -q "versionName='2.303'" /tmp/badging.txt

      - name: Publish updater files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/FX-Souba-Yosou-2.303.apk FX-Souba-Yosou-2.303.apk
          cp /tmp/FX-Souba-Yosou-2.303.apk FX-Souba-Yosou.apk
          cat > latest.json <<'JSON'
          {
            "versionCode": 200303,
            "versionName": "2.303",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/FX-Souba-Yosou-2.303.apk",
            "sha256": "67967bd9db9fcce9f48ff95a417dcc5c04bf5421d51c403dbbb6d13fd16c2b5b"
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f repair-2.303/signed/apk.part*.b64
          git add FX-Souba-Yosou-2.303.apk FX-Souba-Yosou.apk latest.json
          git commit -m "Publish FX updater payload Ver 2.303"
          git push origin HEAD:main
