name: Publish Dinner Photo Log v0.3.7 (signed, native picker)
on:
  push:
    branches: [main]
    paths:
      - 'dinner-build/v037/part-*.b64'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover locally signed APK and verify Android release invariants
        shell: bash
        run: |
          set -euo pipefail
          cat dinner-build/v037/part-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/dinner-v037.zstpatch
          echo 'a0eeb2c276a0d67aea37c0dcc2b75f9fbcdac01cf8b8ada95a80603f5750f03f  /tmp/dinner-v037.zstpatch' | sha256sum -c -
          zstd -d --patch-from=dinner/Dinner-Photo-Log-v0.3.6.apk /tmp/dinner-v037.zstpatch -o /tmp/Dinner-Photo-Log-v0.3.7.apk
          echo 'dd6c991e9f86367d12df5539b0a1719d78f356c2b84b387bdf8d8976cc62f372  /tmp/Dinner-Photo-Log-v0.3.7.apk' | sha256sum -c -
          unzip -t /tmp/Dinner-Photo-Log-v0.3.7.apk >/dev/null
          unzip -p /tmp/Dinner-Photo-Log-v0.3.7.apk assets/app.js > /tmp/app037.js
          node --check /tmp/app037.js
          unzip -p /tmp/Dinner-Photo-Log-v0.3.7.apk classes.dex | strings | grep -F 'android.provider.action.PICK_IMAGES'
          test -s dinner-build/v037/unsigned-android-release.apk
          unzip -p dinner-build/v037/unsigned-android-release.apk classes.dex | sha256sum > /tmp/gradle-dex.sha
          unzip -p /tmp/Dinner-Photo-Log-v0.3.7.apk classes.dex | sha256sum > /tmp/released-dex.sha
          diff /tmp/gradle-dex.sha /tmp/released-dex.sha
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging /tmp/Dinner-Photo-Log-v0.3.7.apk | grep -F "versionCode='20' versionName='0.3.7'"
          SIGTOOL=/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
          "$SIGTOOL" verify --print-certs dinner/Dinner-Photo-Log-v0.3.6.apk >/tmp/old-cert.txt
          "$SIGTOOL" verify --print-certs /tmp/Dinner-Photo-Log-v0.3.7.apk >/tmp/new-cert.txt
          grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/old-cert.txt > /tmp/old-fingerprint.txt
          grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/new-cert.txt > /tmp/new-fingerprint.txt
          diff /tmp/old-fingerprint.txt /tmp/new-fingerprint.txt
          mkdir -p dinner
          cp /tmp/Dinner-Photo-Log-v0.3.7.apk dinner/Dinner-Photo-Log-v0.3.7.apk
          cp /tmp/Dinner-Photo-Log-v0.3.7.apk dinner/Dinner-Photo-Log.apk
          base64 -d dinner-build/v037/source.b64 > dinner-build/source.zip
          unzip -t dinner-build/source.zip >/dev/null
      - name: Publish fixed APK link for existing Update button
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner/Dinner-Photo-Log-v0.3.7.apk dinner/Dinner-Photo-Log.apk dinner-build/source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Dinner Photo Log v0.3.7 with official Google Photos album picker'
          git push origin HEAD:main
      - name: Record release failure for diagnosis
        if: failure()
        shell: bash
        run: |
          echo "FAILED: v0.3.7 was NOT published. Check signature or Gradle output." > dinner-build/v037/release-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dinner-build/v037/release-failure.txt
          git commit -m 'Record v0.3.7 publication failure' || exit 0
          git push origin HEAD:main
