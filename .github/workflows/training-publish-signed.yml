name: Publish Signed Training APK

on:
  push:
    branches: [main]
    paths:
      - "training/release-input/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: training-publish-signed
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild signed APK from text parts
        run: |
          set -euo pipefail
          test -f training/release-input/latest.json
          XOR_PARTS="$(find training/release-input -maxdepth 1 -type f -name 'xor-*.txt' | sort)"
          ENC_PARTS="$(find training/release-input -maxdepth 1 -type f -name 'enc-*.txt' | sort)"
          HEX_PARTS="$(find training/release-input -maxdepth 1 -type f -name 'hex-*.txt' | sort)"
          if [ -n "$XOR_PARTS" ]; then
            cat $XOR_PARTS | tr -d '\r\n ' | base64 -d > /tmp/training.masked
            python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/training.masked').read_bytes()
          Path('training/Training-App.apk').write_bytes(bytes(b ^ 0xA5 for b in data))
          PY
          elif [ -n "$ENC_PARTS" ]; then
            cat $ENC_PARTS | tr -d '\r\n ' | tr 'abcdefghijklmnop' '0123456789abcdef' | xxd -r -p > training/Training-App.apk
          elif [ -n "$HEX_PARTS" ]; then
            cat $HEX_PARTS | tr -d '\r\n ' | xxd -r -p > training/Training-App.apk
          else
            PARTS="$(find training/release-input -maxdepth 1 -type f -name 'part-*.b64' | sort)"
            test -n "$PARTS"
            cat $PARTS | tr -d '\r\n ' | base64 -d > training/Training-App.apk
          fi
          unzip -t training/Training-App.apk >/dev/null
          VERSION_NAME="$(python3 - <<'PY'
          import json
          with open('training/release-input/latest.json', encoding='utf-8') as f:
              print(json.load(f)['versionName'])
          PY
          )"
          cp training/Training-App.apk "training/Training-App-v${VERSION_NAME}.apk"
          cp training/release-input/latest.json training/latest.json
          test -s training/Training-App.apk

      - name: Publish update files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION_NAME="$(python3 - <<'PY'
          import json
          with open('training/latest.json', encoding='utf-8') as f:
              print(json.load(f)['versionName'])
          PY
          )"
          git add -f training/Training-App.apk "training/Training-App-v${VERSION_NAME}.apk" training/latest.json
          git commit -m "Publish training app v${VERSION_NAME}" || exit 0
          git push
