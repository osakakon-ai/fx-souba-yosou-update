name: Publish Signed Training APK

on:
  push:
    branches: [main]
    paths:
      - "training/release-input/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: training-publish-signed
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild signed APK from text parts
        run: |
          set -euo pipefail
          test -f training/release-input/latest.json
          PARTS="$(find training/release-input -maxdepth 1 -type f -name 'part-*.b64' | sort)"
          test -n "$PARTS"
          cat $PARTS | tr -d '\r\n ' | base64 -d > training/Training-App.apk
          unzip -t training/Training-App.apk >/dev/null
          VERSION_NAME="$(python3 - <<'PY'
          import json
          with open('training/release-input/latest.json', encoding='utf-8') as f:
              print(json.load(f)['versionName'])
          PY
          )"
          cp training/Training-App.apk "training/Training-App-v${VERSION_NAME}.apk"
          cp training/release-input/latest.json training/latest.json
          test -s training/Training-App.apk

      - name: Publish update files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION_NAME="$(python3 - <<'PY'
          import json
          with open('training/latest.json', encoding='utf-8') as f:
              print(json.load(f)['versionName'])
          PY
          )"
          git add -f training/Training-App.apk "training/Training-App-v${VERSION_NAME}.apk" training/latest.json
          git commit -m "Publish training app v${VERSION_NAME}" || exit 0
          git push
