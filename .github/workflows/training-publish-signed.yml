name: Publish Signed Training APK
on:
  push:
    branches: [main]
    paths:
      - "training-publish/**"
      - ".github/workflows/training-publish-signed.yml"

permissions:
  contents: write

concurrency:
  group: training-publish-signed
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild signed APK
        run: |
          set -e
          mkdir -p training
          cat training-publish/part-*.txt | tr -d '\n\r ' | base64 -d > training/Training-App.apk
          test "$(stat -c%s training/Training-App.apk)" -gt 1000000
          sha256sum training/Training-App.apk
          cat > training/latest.json <<'EOF'
          {
            "versionCode": 5,
            "versionName": "0.5.0",
            "apkUrl": "https://raw.githubusercontent.com/osakakon-ai/fx-souba-yosou-update/main/training/Training-App.apk"
          }
          EOF
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/Training-App.apk training/latest.json
          git commit -m "Publish training app v0.5.0" || exit 0
          git push
