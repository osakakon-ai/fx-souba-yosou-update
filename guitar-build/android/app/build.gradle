plugins { id 'com.android.application' }

android {
    namespace 'jp.osakakon.guitarchordsheet'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.osakakon.guitarchordsheet'
        minSdk 26
        targetSdk 35
        versionCode 125
        versionName '0.4.2'
    }
    androidResources {
        noCompress += ['flac']
