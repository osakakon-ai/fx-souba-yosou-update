plugins {
    id 'com.android.application'
}

android {
    namespace 'com.konchan.chappyfx'
    compileSdk 35

    signingConfigs {
        fxFixed {
            storeFile file(System.getenv('FX_SIGNING_STORE'))
            storePassword System.getenv('FX_SIGNING_PASSWORD')
            keyAlias 'fxdemo'
            keyPassword System.getenv('FX_SIGNING_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'com.konchan.chappyfx'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('FX_VERSION_CODE') ?: '100000')
        versionName System.getenv('FX_VERSION_NAME') ?: '2.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fxFixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fxFixed
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.signalr:signalr:8.0.30'
}
